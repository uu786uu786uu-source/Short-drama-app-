name: Build Drama Shorts Viewer and Creator APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".build/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .build/archive/part-* > /tmp/drama-source.b64
          test "$(wc -c < /tmp/drama-source.b64)" -eq 76484
          base64 --decode /tmp/drama-source.b64 > /tmp/drama-source.zip
          unzip -q /tmp/drama-source.zip -d .
          test -f drama-shorts-platform/package.json
          python3 - <<'PY'
          from pathlib import Path
          path = Path("drama-shorts-platform/scripts/prepare-native.mjs")
          source = path.read_text()
          old = "cpSync(resolve(studioWww, 'index.html'), resolve(studioWww, 'studio.html'));"
          new = "cpSync(resolve(studioWww, 'studio.html'), resolve(studioWww, 'index.html'));"
          if old not in source:
              raise SystemExit("Expected Studio entry copy line was not found")
          path.write_text(source.replace(old, new))
          PY

      - name: Build both Android apps
        working-directory: drama-shorts-platform
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          if [[ -n "${VITE_SUPABASE_URL:-}" && -n "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_PUBLISHABLE_KEY" > .env
          fi
          npm run android:prepare

          cd native/viewer
          npm install --no-audit --no-fund
          npm install --save-dev typescript --no-audit --no-fund
          npx cap add android
          npx cap sync android

          cd ../studio
          npm install --no-audit --no-fund
          npm install --save-dev typescript --no-audit --no-fund
          npx cap add android
          npx cap sync android

          cd ../viewer/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          cd ../../studio/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Viewer APK
        uses: actions/upload-artifact@v4
        with:
          name: Drama-Shorts-Viewer-APK
          path: drama-shorts-platform/native/viewer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Creator Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: Drama-Creator-Studio-APK
          path: drama-shorts-platform/native/studio/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
