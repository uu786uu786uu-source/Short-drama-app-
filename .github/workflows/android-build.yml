name: Build Drama Shorts Android APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drama-shorts-platform/**"
      - ".github/workflows/android-build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drama-shorts-platform/package-lock.json
      - name: Install dependencies
        working-directory: drama-shorts-platform
        run: npm ci
      - name: Build APKs
        working-directory: drama-shorts-platform
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build:android
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: drama-shorts-android-apks
          path: |
            drama-shorts-platform/native/viewer/android/app/build/outputs/apk/debug/app-debug.apk
            drama-shorts-platform/native/studio/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
