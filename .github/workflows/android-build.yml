name: Build Drama Shorts Viewer and Creator APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".build/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .build/archive/part-* > /tmp/drama-source.b64
          test "$(wc -c < /tmp/drama-source.b64)" -eq 76484
          base64 --decode /tmp/drama-source.b64 > /tmp/drama-source.zip
          unzip -q /tmp/drama-source.zip -d .
          test -f drama-shorts-platform/package.json
          python3 - <<'PY'
          from pathlib import Path
          path = Path("drama-shorts-platform/scripts/prepare-native.mjs")
          source = path.read_text()
          old = "cpSync(resolve(studioWww, 'index.html'), resolve(studioWww, 'studio.html'));"
          new = "cpSync(resolve(studioWww, 'studio.html'), resolve(studioWww, 'index.html'));"
          if old not in source:
              raise SystemExit("Expected Studio entry copy line was not found")
          path.write_text(source.replace(old, new))
          PY

      - name: Inspect source for non-Supabase implementation options
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/app-audit
          find drama-shorts-platform -path '*/node_modules' -prune -o -type f -print | sort > /tmp/app-audit/files.txt
          find drama-shorts-platform -path '*/node_modules' -prune -o -name package.json -type f -print -exec sed -n '1,180p' {} \; > /tmp/app-audit/packages.txt
          grep -RInE 'supabase|firebase|localStorage|indexedDB|upload|auth|coin|episode|video' drama-shorts-platform \
            --include='*.js' --include='*.mjs' --include='*.ts' --include='*.tsx' --include='*.jsx' \
            --exclude-dir=node_modules | head -n 500 > /tmp/app-audit/integration-points.txt || true

      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: Drama-Shorts-Source-Audit
          path: /tmp/app-audit/
          if-no-files-found: error
          retention-days: 7

      - name: Snapshot app source for local-only conversion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/app-source
          cp -a drama-shorts-platform/src /tmp/app-source/
          cp -a drama-shorts-platform/index.html drama-shorts-platform/studio.html /tmp/app-source/
          cp -a drama-shorts-platform/vite.config.js drama-shorts-platform/vite.studio.config.js /tmp/app-source/
          cp -a drama-shorts-platform/scripts /tmp/app-source/
          cp -a drama-shorts-platform/native/viewer/package.json drama-shorts-platform/native/studio/package.json /tmp/app-source/
          cp -a drama-shorts-platform/package.json /tmp/app-source/root-package.json

      - name: Upload app source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Drama-Shorts-App-Source
          path: /tmp/app-source/
          if-no-files-found: error
          retention-days: 7

      - name: Build both Android apps
        working-directory: drama-shorts-platform
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          if [[ -n "${VITE_SUPABASE_URL:-}" && -n "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            printf 'VITE_SUPABASE_URL=%s\\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_PUBLISHABLE_KEY" > .env
          fi
          npm run android:prepare

          cd native/viewer
          rm -f capacitor.config.ts
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.dramashorts.viewer",
            "appName": "Drama Shorts",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          cd ../studio
          rm -f capacitor.config.ts
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.dramashorts.creator",
            "appName": "Drama Creator Studio",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          cd ..
          for wrapper in viewer/android/gradle/wrapper/gradle-wrapper.properties studio/android/gradle/wrapper/gradle-wrapper.properties; do
            sed -i 's/-all[.]zip/-bin.zip/' "$wrapper"
            if grep -q '^networkTimeout=' "$wrapper"; then
              sed -i 's/^networkTimeout=.*/networkTimeout=180000/' "$wrapper"
            else
              echo 'networkTimeout=180000' >> "$wrapper"
            fi
            if grep -q '^retries=' "$wrapper"; then
              sed -i 's/^retries=.*/retries=3/' "$wrapper"
            else
              echo 'retries=3' >> "$wrapper"
            fi
            if grep -q '^retryBackOffMs=' "$wrapper"; then
              sed -i 's/^retryBackOffMs=.*/retryBackOffMs=1000/' "$wrapper"
            else
              echo 'retryBackOffMs=1000' >> "$wrapper"
            fi
          done

          cd viewer/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          cd ../../studio/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Viewer APK
        uses: actions/upload-artifact@v4
        with:
          name: Drama-Shorts-Viewer-APK
          path: drama-shorts-platform/native/viewer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Creator Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: Drama-Creator-Studio-APK
          path: drama-shorts-platform/native/studio/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
