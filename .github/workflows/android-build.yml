name: Build Drama Shorts Viewer and Creator APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".build/**"
      - "offline-overrides/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .build/archive/part-* > /tmp/drama-source.b64
          test "$(wc -c < /tmp/drama-source.b64)" -eq 76484
          base64 --decode /tmp/drama-source.b64 > /tmp/drama-source.zip
          unzip -q /tmp/drama-source.zip -d .
          test -f drama-shorts-platform/package.json
          python3 - <<'PY'
          from pathlib import Path
          path = Path("drama-shorts-platform/scripts/prepare-native.mjs")
          source = path.read_text()
          old = "cpSync(resolve(studioWww, 'index.html'), resolve(studioWww, 'studio.html'));"
          new = "cpSync(resolve(studioWww, 'studio.html'), resolve(studioWww, 'index.html'));"
          if old not in source:
              raise SystemExit("Expected Studio entry copy line was not found")
          path.write_text(source.replace(old, new))
          PY

          # Apply the self-contained offline implementation (no Supabase runtime).
          cat offline-overrides/bundle.part-* > /tmp/offline-overrides.b64
          test "$(wc -c < /tmp/offline-overrides.b64)" -eq 21268
          base64 --decode /tmp/offline-overrides.b64 > /tmp/offline-overrides.zip
          mkdir -p /tmp/offline-overrides
          unzip -q /tmp/offline-overrides.zip -d /tmp/offline-overrides
          cp /tmp/offline-overrides/src/lib.js drama-shorts-platform/src/lib.js
          cp /tmp/offline-overrides/src/viewer.js drama-shorts-platform/src/viewer.js
          cp /tmp/offline-overrides/src/studio.js drama-shorts-platform/src/studio.js
          cp /tmp/offline-overrides/package.json drama-shorts-platform/package.json
          rm -rf drama-shorts-platform/supabase

      - name: Build both Android apps
        working-directory: drama-shorts-platform
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run android:prepare

          cd native/viewer
          rm -f capacitor.config.ts
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.dramashorts.viewer",
            "appName": "Drama Shorts",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          cd ../studio
          rm -f capacitor.config.ts
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.dramashorts.creator",
            "appName": "Drama Creator Studio",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          cd ..
          for wrapper in viewer/android/gradle/wrapper/gradle-wrapper.properties studio/android/gradle/wrapper/gradle-wrapper.properties; do
            sed -i 's/-all[.]zip/-bin.zip/' "$wrapper"
            if grep -q '^networkTimeout=' "$wrapper"; then
              sed -i 's/^networkTimeout=.*/networkTimeout=180000/' "$wrapper"
            else
              echo 'networkTimeout=180000' >> "$wrapper"
            fi
            if grep -q '^retries=' "$wrapper"; then
              sed -i 's/^retries=.*/retries=3/' "$wrapper"
            else
              echo 'retries=3' >> "$wrapper"
            fi
            if grep -q '^retryBackOffMs=' "$wrapper"; then
              sed -i 's/^retryBackOffMs=.*/retryBackOffMs=1000/' "$wrapper"
            else
              echo 'retryBackOffMs=1000' >> "$wrapper"
            fi
          done

          cd viewer/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          cd ../../studio/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Viewer APK
        uses: actions/upload-artifact@v4
        with:
          name: Drama-Shorts-Viewer-APK
          path: drama-shorts-platform/native/viewer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Creator Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: Drama-Creator-Studio-APK
          path: drama-shorts-platform/native/studio/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
